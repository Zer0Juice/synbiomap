project:
  type: website
  output-dir: _site
  resources:
    - assets/data/**
    - assets/figures/**
    - assets/downloads/**

website:
  title: "Patents, Papers, Parts & Planet"
  description: "Do student projects, academic papers, and patents in synthetic biology share topics city by city?"
  site-url: "https://zer0juice.github.io/synbiomap"
  repo-url: "https://github.com/Zer0Juice/synbiomap"
  repo-actions: [issue]
  favicon: assets/favicon.png

  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: "The Study"
        menu:
          - href: background.qmd
            text: Background
          - href: methods.qmd
            text: "Methods & Data"
      - text: "Findings"
        menu:
          - href: results.qmd
            text: Results
          - href: case-study.qmd
            text: "Case Study: Carbon Capture"
      - href: explorer.qmd
        text: Explorer
      - text: "Paper"
        menu:
          - href: paper.qmd
            text: "Summary & PDF"
          - href: references.qmd
            text: References
          - href: slides.qmd
            text: Slides
      - href: reproducibility.qmd
        text: Reproducibility

  page-footer:
    left: "CSH Thesis Project — Synthetic Biology Innovation"
    right:
      - icon: github
        href: "https://github.com/Zer0Juice/synbiomap"

bibliography: [references.bib, references_extra.bib]

format:
  html:
    theme: [cosmo, assets/solarized-light.scss]
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    highlight-style: solarized

execute:
  freeze: auto  # only re-render notebooks when their source changes
